# Copy this file to deploy/secrets.yaml, fill in the values, and keep the
# filled file out of Git. The install script applies it to RELEASE_NAMESPACE.
#
# cp deploy/secrets.example.yaml deploy/secrets.yaml
# $EDITOR deploy/secrets.yaml
# ./deploy/install.sh
#
# The PostgreSQL Secret is usually created by the PostgreSQL operator. If you
# use an external PostgreSQL instance instead, create that Secret separately:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: sealos-notify-pg-conn-credential
# type: Opaque
# stringData:
#   password: "YOUR_DATABASE_PASSWORD"

apiVersion: v1
kind: Secret
metadata:
  name: sealos-notify-api-auth
type: Opaque
stringData:
  apps.yaml: |
    apps:
      - appId: "notify-console"
        appSecret: "YOUR_LONG_RANDOM_SECRET"
        name: "Notify Console"
        enabled: true
---
apiVersion: v1
kind: Secret
metadata:
  name: sealos-notify-feishu-webhook
type: Opaque
stringData:
  webhook-url: "https://open.feishu.cn/open-apis/bot/v2/hook/YOUR_WEBHOOK_TOKEN"
  webhook-secret: "YOUR_WEBHOOK_SIGNING_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: sealos-notify-smtp
type: Opaque
stringData:
  username: ""
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: sealos-notify-feishu
type: Opaque
stringData:
  app-id: ""
  app-secret: ""
