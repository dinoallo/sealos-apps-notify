# User-customizable overrides for Sealos Notify cluster image installs.
# All referenced Secrets must already exist in the Helm release namespace.

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

database:
  host: sealos-notify-pg-postgresql
  port: 5432
  user: postgres
  dbname: postgres
  sslMode: disable
  # Key: password
  passwordSecretName: sealos-notify-pg-conn-credential

auth:
  enabled: true
  # Key: apps.yaml
  secretName: sealos-notify-api-auth

channels:
  email:
    enabled: false
  feishuWebhook:
    enabled: true
  feishuApp:
    enabled: false

providers:
  smtp:
    host: smtp.example.com
    port: 465
    # Keys: username, password
    passwordSecretName: sealos-notify-smtp
    from: notify@example.com
    fromName: "Sealos Notify"
    tlsMode: auto
    timeoutSeconds: 10
  feishuWebhook:
    # Keys: webhook-url, webhook-secret
    secretName: sealos-notify-feishu-webhook
    msgType: interactive
    timeoutSeconds: 10
  feishuApp:
    # Keys: app-id, app-secret
    secretName: sealos-notify-feishu
    receiveIdType: open_id
    urgentUserIdType: open_id
    msgType: text
    urgentType: app
