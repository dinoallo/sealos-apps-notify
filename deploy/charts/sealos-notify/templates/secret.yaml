{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $authSecretName := include "sealos-notify.authSecretName" . -}}
{{- $existingAuthSecret := lookup "v1" "Secret" .Release.Namespace $authSecretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authSecretName }}
  labels:
    {{- include "sealos-notify.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.auth.appsYaml }}
stringData:
  apps.yaml: |
{{ .Values.auth.appsYaml | indent 4 }}
{{- else if and $existingAuthSecret (hasKey $existingAuthSecret.data "apps.yaml") }}
data:
  apps.yaml: {{ index $existingAuthSecret.data "apps.yaml" | quote }}
{{- else }}
stringData:
  apps.yaml: |
    apps:
      - appId: {{ .Values.auth.defaultAppId | quote }}
        appSecret: {{ randAlphaNum 32 | quote }}
        name: {{ .Values.auth.defaultAppName | quote }}
        enabled: true
{{- end }}
{{- end }}
{{- if and .Values.database.password (not .Values.database.passwordSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sealos-notify.databaseSecretName" . }}
  labels:
    {{- include "sealos-notify.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.passwordSecretKey }}: {{ .Values.database.password | quote }}
{{- end }}
{{- if and .Values.channels.email.enabled .Values.providers.smtp.password (not .Values.providers.smtp.passwordSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sealos-notify.smtpSecretName" . }}
  labels:
    {{- include "sealos-notify.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.providers.smtp.passwordSecretKey }}: {{ .Values.providers.smtp.password | quote }}
{{- end }}
{{- if and .Values.channels.feishuApp.enabled (not .Values.providers.feishuApp.secretName) (or .Values.providers.feishuApp.appId .Values.providers.feishuApp.appSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sealos-notify.feishuAppSecretName" . }}
  labels:
    {{- include "sealos-notify.labels" . | nindent 4 }}
type: Opaque
stringData:
  app-id: {{ .Values.providers.feishuApp.appId | quote }}
  app-secret: {{ .Values.providers.feishuApp.appSecret | quote }}
{{- end }}
