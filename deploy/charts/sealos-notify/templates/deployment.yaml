{{- $databaseSecretName := include "sealos-notify.databaseSecretName" . -}}
{{- $smtpSecretName := include "sealos-notify.smtpSecretName" . -}}
{{- $feishuWebhookSecretName := include "sealos-notify.feishuWebhookSecretName" . -}}
{{- $feishuAppSecretName := include "sealos-notify.feishuAppSecretName" . -}}
{{- $volcengineSmsSecretName := include "sealos-notify.volcengineSmsSecretName" . -}}
{{- $aliyunSmsSecretName := include "sealos-notify.aliyunSmsSecretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sealos-notify.fullname" . }}
  labels:
    {{- include "sealos-notify.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sealos-notify.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        originImageName: {{ include "sealos-notify.image" . | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sealos-notify.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: sealos-notify
          image: {{ include "sealos-notify.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - -c
            - /etc/sealos-notify/config.yaml
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $databaseSecretName }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $databaseSecretName }}
                  key: password
            {{- end }}
            {{- if and .Values.channels.email.enabled $smtpSecretName }}
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $smtpSecretName }}
                  key: username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $smtpSecretName }}
                  key: password
            {{- end }}
            {{- if and .Values.channels.feishuWebhook.enabled $feishuWebhookSecretName }}
            - name: FEISHU_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $feishuWebhookSecretName }}
                  key: webhook-url
            - name: FEISHU_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $feishuWebhookSecretName }}
                  key: webhook-secret
            {{- end }}
            {{- if and .Values.channels.feishuApp.enabled $feishuAppSecretName }}
            - name: FEISHU_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $feishuAppSecretName }}
                  key: app-id
            - name: FEISHU_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $feishuAppSecretName }}
                  key: app-secret
            {{- end }}
            {{- if and .Values.channels.sms.enabled (eq .Values.channels.sms.providerType "volcengine_sms") $volcengineSmsSecretName }}
            - name: VOLCENGINE_SMS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $volcengineSmsSecretName }}
                  key: {{ .Values.providers.volcengineSms.accessKeySecretKey }}
            - name: VOLCENGINE_SMS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $volcengineSmsSecretName }}
                  key: {{ .Values.providers.volcengineSms.secretKeySecretKey }}
            {{- end }}
            {{- if and .Values.channels.sms.enabled (eq .Values.channels.sms.providerType "aliyun_sms") $aliyunSmsSecretName }}
            - name: ALIYUN_SMS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $aliyunSmsSecretName }}
                  key: {{ .Values.providers.aliyunSms.accessKeyIdSecretKey }}
            - name: ALIYUN_SMS_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $aliyunSmsSecretName }}
                  key: {{ .Values.providers.aliyunSms.accessKeySecretKey }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/sealos-notify
              readOnly: true
            {{- if and .Values.auth.enabled .Values.auth.secretName }}
            - name: api-auth
              mountPath: /etc/sealos-notify/auth
              readOnly: true
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "sealos-notify.configMapName" . }}
        {{- if and .Values.auth.enabled .Values.auth.secretName }}
        - name: api-auth
          secret:
            secretName: {{ include "sealos-notify.authSecretName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
